<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>

    <div class="container">

        <header class="site-header">
            <div class="logo"></div>
            <div class="logo-text">factum</div>
        </header>

        <div class="grid-container">

            <aside>
                <h3>Projects</h3>
                <div class="add-project-input">
                    <form id="project-form">
                        <input type="text" name="project-name" id="project-name" placeholder="Project Name" required>
                        <button id="project-btn" type="submit">Create</button>
                    </form>
                </div>
                <section class="projects"></section>
            </aside>

            <main class="main-content">
                <h3>Todos for <span class="active-project">None</span></h3>
                <section class="todos"></section>
            </main>

        </div>

        <footer>
            <div class="copy">Copyright &copy; <em>factum</em> | D. Harrison 2026</div>
        </footer>

    </div>
</body>

</html>
