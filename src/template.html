<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title></title>
</head>

<body>

    <div class="container">

        <header class="site-header">
            <div class="logo"></div>
            <div class="logo-text">factum</div>
        </header>

        <aside>
            <section class="projects">
                <header class="projects-header">
                    <h3>Projects</h3>
                </header>
                <form id="project-form">
                    <input type="text" id="project-name" name="project-name" placeholder="Project Name" required>
                    <button type="submit">Add Project</button>
                </form>
                <div class="project-list"></div>
            </section>
        </aside>

        <main>
            <section class="todos">
                <header class="todos-header">
                    <h3>Todo Items for: <span id="active-project">None</span></h3>
                </header>
                <dialog id="todo-dialog">
                    <form id="todo-form">
                        <input type="text" id="title" name="title" placeholder="Add a todo item" required>
                        <textarea name="description" id="description" cols="10" rows="3"
                            placeholder="Description of todo item"></textarea>
                        <input type="date" name="due-date" id="due-date">
                        <select name="priorities" id="priorities">
                            <option value="low" selected>Low</option>
                            <option value="medium">Medium</option>
                            <option value="high">High</option>
                        </select>
                        <textarea name="notes" id="notes" cols="10" rows="3" placeholder="Any notes..."></textarea>
                        <button type="submit">Add Todo</button>
                    </form>
                </dialog>
                <div class="todos-list"></div>
            </section>
        </main>

        <footer>
            <div class="copy">Copyright &copy; <em>factum</em> | D. Harrison 2026</div>
        </footer>

    </div>

</body>

</html>
