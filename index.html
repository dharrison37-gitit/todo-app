<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title></title><link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons"><script defer="defer" src="app.bundle.js"></script></head><body><div class="container"><header class="site-header"><div class="logo"></div><div class="logo-text">factum</div></header><div class="grid-container"><aside><h3 class="bottom-space">Projects</h3><div class="add-project-input"><form id="project-form"><input name="project-name" id="project-name" placeholder="Project Name" required> <button id="project-btn" type="submit">Create</button></form></div><div id="project-container"></div></aside><main class="main-content"><h3 class="bottom-space">Todos for <span class="active-project">None</span>&nbsp;<span class="add-todo"></span></h3><div id="todo-container"></div></main><dialog class="todo-dialog"><form id="todo-form"><input name="title" id="title" placeholder="Title" required> <textarea name="description" id="description" cols="10" rows="3" placeholder="Description"></textarea> <label for="due">Due:</label> <input type="date" name="due" id="due"> <label for="priority">Priority:</label> <select name="priority" id="priority"><option value="low">Low</option><option value="medium">Medium</option><option value="high">High</option></select> <textarea name="notes" id="notes" cols="10" rows="3" placeholder="Notes"></textarea><div class="button-container"><button type="submit" class="add-btn">Submit</button> <button type="button" class="cancel-btn">Cancel</button></div></form></dialog></div><template id="project-template"><div class="project-item"><div class="project-name"><h3 data-field="name" class="project-header"></h3></div><div class="project-controls"><button id="project-update" class="update-button"><i class="material-icons">edit_note</i></button> <button id="project-delete" class="delete-button"><i class="material-icons">delete</i></button></div></div></template><template id="todo-template"><h3 data-field="title" class="todo-header"></h3><div class="todo-details" data-id="0"><div class="details"><p data-field="description"></p><p data-field="due-date"></p><p data-field="priority"></p><p data-field="notes"></p></div><div id="controls"><button class="delete-button"><i class="material-icons">delete</i></button> <button class="update-button"><i class="material-icons">edit_note</i></button></div><div class="completed-container"><button class="completed">Complete</button></div></div></template><footer><div class="copy">Copyright &copy; <em>factum</em> | D. Harrison 2026</div></footer></div></body></html>
